# Builds and tests the CLI on Linux, macOS and Windows and installs the packed tarball. Required to merge into dev and main.
name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRs into main: the version and both changelogs must match what the commits since the last tag call for.
  version:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - run: node scripts/release.mjs check

  # PR titles become the squash commit, and the release version is derived from commit types: keep them conventional.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|chore|ci|build|style|revert)(\([^)]+\))?!?: .+|^Release |^dev → main' \
            || { echo "PR title must be a Conventional Commit, e.g. 'fix(pick): skip missing CLIs' (got: $TITLE)"; exit 1; }

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish # the completion test runs each shell it finds
      - run: npm ci
      - run: npm test
      - name: install from the packed tarball
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          $t = $env:RUNNER_TEMP; $sep = [IO.Path]::PathSeparator
          npm pack --pack-destination $t
          npm i -g --no-audit --no-fund --prefix "$t/prefix" (Get-Item "$t/irythill-orq-*.tgz").FullName
          $env:PATH = "$t/prefix$sep$t/prefix/bin$sep$env:PATH"
          $env:HOME = "$t/home"; $env:USERPROFILE = "$t/home"; $env:APPDATA = "$t/appdata"; $env:LOCALAPPDATA = "$t/localappdata"
          $env:XDG_CONFIG_HOME = "$t/cfg"; $env:XDG_STATE_HOME = "$t/state"; $env:ORQ_LANG = 'en'
          orq --version
          orq setup --install
          if (-not (Test-Path "$t/home/.claude/skills/issue/SKILL.md")) { throw 'skills not linked' }
          New-Item -ItemType Directory "$t/ws" | Out-Null
          orq setup --workspace "$t/ws" --conductor codex
          if (-not (Select-String -Quiet -Path "$t/ws/AGENTS.md" -Pattern 'orq:issue begin')) { throw 'no playbook' }
          orq quota antigravity
          orq completion powershell | Out-String | Invoke-Expression
          (TabExpansion2 'orq comp' 8).CompletionMatches.CompletionText
