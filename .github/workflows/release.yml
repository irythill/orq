# Publishes @irythill/orq to npm when main carries a version not on npm yet (a dev → main merge, checked by the
# `version` job in ci.yml), or when a v* tag is pushed by hand. Trusted publishing (OIDC): no npm token in the repo, and
# the package gets provenance linking it to this repo and commit. The GitHub release (and its tag) come from the
# CHANGELOG section.
name: release
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write # the tag and the GitHub release
  id-token: write # npm trusted publishing
concurrency:
  group: release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # add required reviewers to this environment to approve each publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: what is left to release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$v" ]; then echo "tag $GITHUB_REF_NAME != package.json $v"; exit 1; fi
          # Each step checks its own target, so a rerun after a partial failure finishes the job instead of repeating it.
          npm view "@irythill/orq@$v" version >/dev/null 2>&1 && npm=done || npm=todo
          gh release view "v$v" >/dev/null 2>&1 && gh=done || gh=todo
          echo "v$v: npm $npm, GitHub release $gh"
          { echo "version=$v"; echo "npm=$npm"; echo "gh=$gh"; } >> "$GITHUB_OUTPUT"
      - if: steps.v.outputs.npm == 'todo'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - if: steps.v.outputs.npm == 'todo'
        run: npm ci
      - if: steps.v.outputs.npm == 'todo'
        run: npm test
      - if: steps.v.outputs.npm == 'todo'
        run: npm publish --provenance
      - name: tag + GitHub release with the CHANGELOG section
        if: steps.v.outputs.gh == 'todo'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="$V" 'index($0, "## [" v "]") == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          printf '\nInstall: `npm i -g @irythill/orq` then `orq setup`.\n' >> notes.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md
